<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="原创三星系亚空间星图背景">
  <defs>
    <radialGradient id="void" cx="50%" cy="44%" r="76%">
      <stop offset="0%" stop-color="#183237"/>
      <stop offset="34%" stop-color="#0d1d21"/>
      <stop offset="74%" stop-color="#071013"/>
      <stop offset="100%" stop-color="#030608"/>
    </radialGradient>
    <radialGradient id="solarNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0bd63" stop-opacity=".26"/>
      <stop offset="38%" stop-color="#9f6539" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#6a3d25" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="alphaNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ae0d0" stop-opacity=".22"/>
      <stop offset="42%" stop-color="#2e756f" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#143b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gammaNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c276e1" stop-opacity=".24"/>
      <stop offset="42%" stop-color="#6b397f" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#261333" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rift" x1="0%" y1="12%" x2="100%" y2="88%">
      <stop offset="0%" stop-color="#d66f43" stop-opacity="0"/>
      <stop offset="22%" stop-color="#e07a4f" stop-opacity=".2"/>
      <stop offset="46%" stop-color="#bc4d42" stop-opacity=".42"/>
      <stop offset="54%" stop-color="#7ee0ce" stop-opacity=".22"/>
      <stop offset="78%" stop-color="#4d7d7e" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#20383f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbitMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d894" stop-opacity=".6"/>
      <stop offset="50%" stop-color="#a27038" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#4d716e" stop-opacity=".42"/>
    </linearGradient>
    <pattern id="hexGrid" width="76" height="88" patternUnits="userSpaceOnUse">
      <path d="M38 0 76 22v44L38 88 0 66V22Z" fill="none" stroke="#9fbab3" stroke-opacity=".055" stroke-width="1"/>
      <path d="M38 9 67 26v36L38 79 9 62V26Z" fill="none" stroke="#cfb877" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <pattern id="microStars" width="180" height="160" patternUnits="userSpaceOnUse">
      <g fill="#e9eee8">
        <circle cx="18" cy="27" r=".9" opacity=".58"/>
        <circle cx="74" cy="51" r=".65" opacity=".42"/>
        <circle cx="139" cy="19" r="1.1" opacity=".62"/>
        <circle cx="108" cy="102" r=".7" opacity=".38"/>
        <circle cx="35" cy="132" r="1" opacity=".48"/>
        <circle cx="164" cy="142" r=".65" opacity=".4"/>
      </g>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="riftTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .018" numOctaves="4" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.74 0 0 0 0 0.83 0 0 0 0 0.76 0 0 0 .035 0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#void)"/>
  <ellipse cx="880" cy="210" rx="480" ry="300" fill="url(#solarNebula)"/>
  <ellipse cx="390" cy="710" rx="520" ry="300" fill="url(#alphaNebula)"/>
  <ellipse cx="1210" cy="730" rx="500" ry="290" fill="url(#gammaNebula)"/>
  <rect width="1600" height="1000" fill="url(#hexGrid)"/>
  <rect width="1600" height="1000" fill="url(#microStars)"/>

  <path d="M-120 724C170 446 366 692 656 430S1108 122 1732 354"
    fill="none" stroke="url(#rift)" stroke-width="94" opacity=".72" filter="url(#riftTexture)"/>
  <path d="M-100 728C174 472 382 696 672 448S1110 154 1724 372"
    fill="none" stroke="#f1bc79" stroke-opacity=".2" stroke-width="3" filter="url(#softGlow)"/>
  <path d="M-90 752C184 504 402 718 704 474S1120 184 1718 399"
    fill="none" stroke="#527f7d" stroke-opacity=".18" stroke-width="2" stroke-dasharray="5 13"/>

  <g fill="none" stroke="url(#orbitMetal)" opacity=".38">
    <ellipse cx="790" cy="247" rx="252" ry="104" transform="rotate(-11 790 247)"/>
    <ellipse cx="366" cy="716" rx="258" ry="104" transform="rotate(14 366 716)"/>
    <ellipse cx="1238" cy="718" rx="255" ry="104" transform="rotate(-15 1238 718)"/>
  </g>
  <g fill="none" stroke="#d6b56d" stroke-opacity=".12">
    <circle cx="790" cy="247" r="164" stroke-dasharray="2 9"/>
    <circle cx="366" cy="716" r="164" stroke-dasharray="2 9"/>
    <circle cx="1238" cy="718" r="164" stroke-dasharray="2 9"/>
  </g>

  <g fill="#edf3ed" filter="url(#softGlow)">
    <circle cx="98" cy="124" r="1.5" opacity=".78"/>
    <circle cx="212" cy="276" r="2.1" opacity=".58"/>
    <circle cx="344" cy="92" r="1.2" opacity=".82"/>
    <circle cx="462" cy="332" r="1.7" opacity=".54"/>
    <circle cx="574" cy="156" r="2.4" opacity=".68"/>
    <circle cx="691" cy="88" r="1.1" opacity=".86"/>
    <circle cx="838" cy="426" r="1.5" opacity=".58"/>
    <circle cx="947" cy="182" r="2.2" opacity=".7"/>
    <circle cx="1088" cy="104" r="1.3" opacity=".76"/>
    <circle cx="1214" cy="268" r="1.8" opacity=".6"/>
    <circle cx="1384" cy="182" r="2.4" opacity=".68"/>
    <circle cx="1510" cy="408" r="1.3" opacity=".74"/>
    <circle cx="144" cy="682" r="1.9" opacity=".66"/>
    <circle cx="286" cy="824" r="1.1" opacity=".78"/>
    <circle cx="526" cy="686" r="2.2" opacity=".56"/>
    <circle cx="718" cy="874" r="1.4" opacity=".76"/>
    <circle cx="912" cy="724" r="2" opacity=".6"/>
    <circle cx="1014" cy="918" r="1.2" opacity=".72"/>
    <circle cx="1192" cy="812" r="2.4" opacity=".58"/>
    <circle cx="1342" cy="628" r="1.5" opacity=".78"/>
    <circle cx="1534" cy="742" r="1.1" opacity=".72"/>
  </g>

  <g opacity=".42">
    <path d="M52 52h82M52 52v82M1548 52h-82M1548 52v82M52 948h82M52 948v-82M1548 948h-82M1548 948v-82"
      fill="none" stroke="#d8bd7d" stroke-width="2"/>
    <path d="M66 66h54M1480 66h54M66 934h54M1480 934h54"
      fill="none" stroke="#8a5938" stroke-width="4"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".5"/>
</svg>
